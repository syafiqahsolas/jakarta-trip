<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lily Pond Travel Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styling Variables for Cozy Aesthetic -->
  <style>
    :root {
      --pond-green: #1b4332;
      --sage-green: #2d6a4f;
      --pond-bg: #f4f7f6;
    }
    body {
      background-color: var(--pond-bg);
      color: #2b2b2b;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .lily-card {
      background: #ffffff;
      border: 1px solid rgba(27, 67, 50, 0.08);
      border-radius: 1.25rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- ================= SECTION 1: HOME PAGE (TRIPS LIST) ================= -->
  <section id="section-home" class="max-w-md mx-auto p-4 space-y-4">
    <header class="flex justify-between items-center py-3">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-800">Lily Pond Hub</span>
        <h1 style="color: var(--pond-green);" class="font-extrabold text-2xl">My Trips</h1>
      </div>
      <button onclick="openTripModal()" style="background-color: var(--pond-green);" class="w-10 h-10 rounded-full text-white flex items-center justify-center shadow-md">
        <i class="fa-solid fa-plus text-sm"></i>
      </button>
    </header>

    <!-- Sub-tabs: Upcoming vs All -->
    <div class="flex space-x-2 bg-stone-200/60 p-1 rounded-2xl">
      <button id="home-tab-upcoming" onclick="switchHomeTab('upcoming')" class="flex-1 py-2 rounded-xl text-xs font-bold text-stone-800 bg-white shadow-xs transition-all">Upcoming</button>
      <button id="home-tab-all" onclick="switchHomeTab('all')" class="flex-1 py-2 rounded-xl text-xs font-semibold text-stone-500 transition-all">All Trips</button>
    </div>

    <!-- Upcoming Trips View -->
    <div id="home-view-upcoming" class="space-y-3">
      <div id="upcoming-trips-list" class="space-y-3">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>

    <!-- All Trips View -->
    <div id="home-view-all" class="space-y-3 hidden">
      <div class="flex gap-2">
        <input type="text" id="tripSearchInput" oninput="renderAllTripsList()" placeholder="Search trips..." class="w-full bg-white border border-stone-200 rounded-2xl p-2.5 text-xs">
        <select id="tripCategoryFilter" onchange="renderAllTripsList()" class="bg-white border border-stone-200 rounded-2xl p-2.5 text-xs">
          <option value="ALL">All Categories</option>
          <option value="Vacation">Vacation</option>
          <option value="Business">Business</option>
        </select>
      </div>
      <div id="all-trips-list" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>


  <!-- ================= SECTION 2: ACTIVE TRIP DASHBOARD ================= -->
  <section id="section-trip-dashboard" class="max-w-md mx-auto p-4 space-y-4 hidden">
    <!-- Trip Header / Banner -->
    <div style="background-color: var(--pond-green);" class="text-white p-5 rounded-3xl shadow-md space-y-3 relative overflow-hidden">
      <div class="flex justify-between items-start">
        <button onclick="openHomePage('upcoming')" class="text-xs bg-white/20 px-3 py-1 rounded-full font-semibold"><i class="fa-solid fa-arrow-left me-1"></i>Back to Trips</button>
        <button onclick="openTripModal(activeTripId)" class="text-white/80 hover:text-white"><i class="fa-solid fa-pen text-xs"></i></button>
      </div>
      <div>
        <span id="sum-card-category" class="text-[10px] uppercase tracking-wider font-bold bg-white/20 px-2.5 py-0.5 rounded-full">Vacation</span>
        <h2 id="sum-card-title" class="font-extrabold text-xl mt-1">Trip Name</h2>
        <p id="sum-card-dates" class="text-xs text-stone-200 mt-0.5">Dates TBD</p>
      </div>
      <div class="flex justify-between items-center text-xs pt-2 border-t border-white/10">
        <span><i class="fa-solid fa-users me-1"></i><span id="sum-card-people">1 Pax</span></span>
        <span class="font-bold"><span id="sum-card-budget">RM 0</span></span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="flex justify-between bg-white border border-stone-200/80 p-1.5 rounded-2xl shadow-xs text-xs font-medium text-stone-500 overflow-x-auto">
      <button id="nav-summary" onclick="switchDashboardPage('summary')" class="px-3 py-2 rounded-xl transition-all">Summary</button>
      <button id="nav-itinerary" onclick="switchDashboardPage('itinerary')" class="px-3 py-2 rounded-xl transition-all">Itinerary</button>
      <button id="nav-waddle" onclick="switchDashboardPage('waddle')" class="px-3 py-2 rounded-xl transition-all">Waddle</button>
      <button id="nav-master" onclick="switchDashboardPage('master')" class="px-3 py-2 rounded-xl transition-all">Locations</button>
      <button id="nav-checklists" onclick="switchDashboardPage('checklists')" class="px-3 py-2 rounded-xl transition-all">Checklist</button>
    </nav>

    <!-- PAGE A: SUMMARY -->
    <div id="page-summary" class="space-y-4">
      <div class="lily-card p-4 space-y-3">
        <div class="flex justify-between items-center">
          <h3 style="color: var(--pond-green);" class="font-bold text-sm">Starred Must-Visits</h3>
          <button onclick="unstarAllLocations()" class="text-[10px] text-stone-400 hover:text-red-500">Unstar All</button>
        </div>
        <div id="summary-starred-spots" class="grid grid-cols-2 gap-2">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="lily-card p-4 space-y-3">
        <h3 style="color: var(--pond-green);" class="font-bold text-sm">Key Itinerary Snapshot</h3>
        <div id="summary-tentative-snapshot" class="space-y-2">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <!-- PAGE B: ITINERARY -->
    <div id="page-itinerary" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <div id="itinerary-day-buttons" class="flex space-x-2 overflow-x-auto pb-1 max-w-[280px]">
          <!-- Day buttons dynamically generated -->
        </div>
        <button onclick="openItineraryModal()" style="background-color: var(--pond-green);" class="px-3.5 py-2 text-white rounded-2xl text-xs font-semibold shadow-xs flex-shrink-0">
          <i class="fa-solid fa-plus me-1"></i>Add
        </button>
      </div>
      <div id="itinerary-timeline-container" class="space-y-3 pt-1">
        <!-- Activities sorted chronologically -->
      </div>
    </div>

    <!-- PAGE C: WADDLE -->
    <div id="page-waddle" class="space-y-4 hidden">
      <div style="background-color: var(--pond-green);" class="text-white p-4 rounded-3xl shadow-sm space-y-2">
        <div class="flex justify-between items-start">
          <div>
            <span class="text-[10px] uppercase font-bold tracking-wider text-emerald-300">Accommodation Base</span>
            <h3 id="waddle-hotel-title" class="font-bold text-sm mt-0.5">Hotel Name</h3>
          </div>
          <button onclick="openHotelModal()" class="text-xs bg-white/20 px-2.5 py-1 rounded-xl font-semibold"><i class="fa-solid fa-pen text-[10px] me-1"></i>Change</button>
        </div>
        <p id="waddle-hotel-station" class="text-xs text-stone-200">Nearest Station: Loading...</p>
      </div>

      <div class="lily-card p-4 space-y-3">
        <label style="color: var(--pond-green);" class="font-bold text-xs uppercase tracking-wider block"><i class="fa-solid fa-magnifying-glass me-1"></i>Cluster Search</label>
        <input type="text" id="waddleSearchInput" oninput="executeWaddleSearch()" placeholder="Search by category, station, or place..." class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-xs">
        <div id="waddle-quick-hubs" class="flex flex-wrap gap-1.5 pt-1">
          <!-- Clutter-free top 3 station chips -->
        </div>
      </div>
      <div id="waddleSearchResults" class="space-y-2">
        <!-- Results -->
      </div>
    </div>

    <!-- PAGE D: LOCATIONS DATABASE -->
    <div id="page-master" class="space-y-3 hidden">
      <div class="flex gap-2 items-center">
        <input type="text" id="masterSearchInput" oninput="renderMasterPlacesList()" placeholder="Search locations..." class="w-full bg-white border border-stone-200 rounded-2xl p-2.5 text-xs">
        
        <!-- GPS Proximity Sort Button -->
        <button onclick="sortByUserLocation()" title="Sort by Nearest to Me" class="px-3 py-2.5 bg-emerald-100 text-emerald-800 rounded-2xl text-xs font-semibold flex-shrink-0 flex items-center gap-1">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>

        <select id="masterCategoryFilter" onchange="renderMasterPlacesList()" class="bg-white border border-stone-200 rounded-2xl p-2.5 text-xs">
          <option value="ALL">All Categories</option>
          <option value="Attraction">Attraction</option>
          <option value="Coffee">Coffee</option>
          <option value="Food">Food</option>
          <option value="Shopping Mall">Shopping Mall</option>
        </select>
        <button onclick="openMasterSpotModal()" style="background-color: var(--pond-green);" class="px-3 py-2.5 text-white rounded-2xl text-xs font-semibold flex-shrink-0"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="masterPlacesContainer" class="space-y-2">
        <!-- Places list -->
      </div>
    </div>

    <!-- PAGE E: CHECKLISTS & EXPENSES -->
    <div id="page-checklists" class="space-y-4 hidden">
      <div class="flex space-x-2 bg-stone-200/60 p-1 rounded-2xl">
        <button id="checktab-prep" onclick="switchChecklistSubTab('prep'); renderChecklistsAndExpenses();" class="flex-1 py-2 rounded-xl text-xs font-bold text-stone-800 bg-white shadow-xs transition-all">Prep</button>
        <button id="checktab-packing" onclick="switchChecklistSubTab('packing'); renderChecklistsAndExpenses();" class="flex-1 py-2 rounded-xl text-xs font-semibold text-stone-500 transition-all">Packing</button>
        <button id="checktab-expenses" onclick="switchChecklistSubTab('expenses'); renderChecklistsAndExpenses();" class="flex-1 py-2 rounded-xl text-xs font-semibold text-stone-500 transition-all">Expenses</button>
      </div>
      <div id="checklist-sub-prep" class="space-y-2 text-xs pt-1">
        <!-- Rendered dynamically -->
      </div>
      <div id="checklist-sub-packing" class="space-y-2 text-xs pt-1 hidden">
        <!-- Rendered dynamically -->
      </div>
      <div id="checklist-sub-expenses" class="space-y-2 text-xs pt-1 hidden">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>


  <!-- ================= MODALS ================= -->

  <!-- Modal 1: Add/Edit Trip -->
  <div id="modal-trip" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl border-2 border-stone-200">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h3 id="modal-trip-title" style="color: var(--pond-green);" class="font-bold text-base">Add New Trip</h3>
        <button onclick="closeModal('modal-trip')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input type="hidden" id="trip-form-id" />
      <div class="space-y-3 text-xs">
        <div><label class="block text-stone-500 mb-1 font-medium">Trip Destination Name</label><input type="text" id="trip-form-title" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-stone-500 mb-1 font-medium">Start Date</label><input type="date" id="trip-form-start-date" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
          <div><label class="block text-stone-500 mb-1 font-medium">End Date</label><input type="date" id="trip-form-end-date" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        </div>
        <div>
          <label class="block text-stone-500 mb-1 font-medium">Trip Category</label>
          <select id="trip-form-category" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800">
            <option value="Vacation">Vacation</option>
            <option value="Business">Business</option>
          </select>
        </div>
        <div><label class="block text-stone-500 mb-1 font-medium">Travelers</label><input type="text" id="trip-form-people" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        <div><label class="block text-stone-500 mb-1 font-medium">Target Budget</label><input type="text" id="trip-form-budget" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-trip')" class="px-3.5 py-2 bg-stone-100 text-stone-600 rounded-2xl text-xs font-medium">Cancel</button>
        <button onclick="saveTripForm()" style="background-color: var(--pond-green);" class="px-4 py-2 text-white rounded-2xl text-xs font-semibold">Save Trip</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Itinerary Activity (Standardized Time Picker) -->
  <div id="modal-itinerary" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl border-2 border-stone-200">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h3 style="color: var(--pond-green);" class="font-bold text-base">Itinerary Activity</h3>
        <button onclick="closeModal('modal-itinerary')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div><label class="block text-stone-500 mb-1 font-medium">Activity Title</label><input type="text" id="itin-form-title" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        <div>
          <label class="block text-stone-500 mb-1 font-medium">Time</label>
          <input type="time" id="itin-form-time" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800 font-semibold">
        </div>
        <div><label class="block text-stone-500 mb-1 font-medium">Location</label><input type="text" id="itin-form-location" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        <div><label class="block text-stone-500 mb-1 font-medium">Notes</label><textarea id="itin-form-notes" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800 h-20"></textarea></div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-itinerary')" class="px-3.5 py-2 bg-stone-100 text-stone-600 rounded-2xl text-xs font-medium">Cancel</button>
        <button onclick="saveItineraryForm()" style="background-color: var(--pond-green);" class="px-4 py-2 text-white rounded-2xl text-xs font-semibold">Save Activity</button>
      </div>
    </div>
  </div>

  <!-- Modal 3: City-First Hotel Base Setup -->
  <div id="modal-hotel" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl border-2 border-stone-200">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h3 style="color: var(--pond-green);" class="font-bold text-base">Select Hotel Base</h3>
        <button onclick="closeModal('modal-hotel')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-stone-500 mb-1 font-medium">1. Choose City</label>
          <select id="hotel-city-dropdown" onchange="populateHotelNameDropdown()" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800 font-semibold">
            <!-- Populated dynamically -->
          </select>
        </div>
        <div>
          <label class="block text-stone-500 mb-1 font-medium">2. Choose Hotel</label>
          <select id="hotel-name-dropdown" onchange="onHotelSelectionChange()" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800 font-semibold">
            <!-- Populated dynamically based on city -->
          </select>
        </div>
        <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/60 space-y-1">
          <span class="text-[10px] text-stone-400 font-semibold uppercase tracking-wider">Auto-Calculated Nearest Station</span>
          <p id="hotel-form-preview-station" style="color: var(--pond-green);" class="font-bold text-xs">Select hotel...</p>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-hotel')" class="px-3.5 py-2 bg-stone-100 text-stone-600 rounded-2xl text-xs font-medium">Cancel</button>
        <button onclick="saveHotelForm()" style="background-color: var(--pond-green);" class="px-4 py-2 text-white rounded-2xl text-xs font-semibold">Save Hotel</button>
      </div>
    </div>
  </div>

  <!-- Modal 4: Master Spot Add/Edit -->
  <div id="modal-master-spot" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl border-2 border-stone-200">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h3 id="modal-spot-title" style="color: var(--pond-green);" class="font-bold text-base">Location Spot</h3>
        <button onclick="closeModal('modal-master-spot')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input type="hidden" id="spot-form-id" />
      <div class="space-y-3 text-xs">
        <div><label class="block text-stone-500 mb-1 font-medium">Spot Name</label><input type="text" id="spot-form-name" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        <div>
          <label class="block text-stone-500 mb-1 font-medium">Category</label>
          <select id="spot-form-category" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800">
            <option value="Attraction">Attraction</option>
            <option value="Coffee">Coffee</option>
            <option value="Food">Food</option>
            <option value="Shopping Mall">Shopping Mall</option>
          </select>
        </div>
        <div><label class="block text-stone-500 mb-1 font-medium">Nearest Station</label><input type="text" id="spot-form-station" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
        <div><label class="block text-stone-500 mb-1 font-medium">Walking Note</label><input type="text" id="spot-form-walk" placeholder="e.g., 5 min walk" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-2.5 text-stone-800"></div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-master-spot')" class="px-3.5 py-2 bg-stone-100 text-stone-600 rounded-2xl text-xs font-medium">Cancel</button>
        <button onclick="saveMasterSpotForm()" style="background-color: var(--pond-green);" class="px-4 py-2 text-white rounded-2xl text-xs font-semibold">Save Spot</button>
      </div>
    </div>
  </div>


  <!-- ================= SCRIPTS ================= -->
  <!-- 1. Firebase Core Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- 2. Master Reference Data & Modules -->
  <script src="transit_data.js"></script>
  <script src="hotel_data.js"></script>
  <script src="locations.js"></script>

  <!-- 3. Core App Logic -->
  <script src="app.js"></script>

</body>
</html>
